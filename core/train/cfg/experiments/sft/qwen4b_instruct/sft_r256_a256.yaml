DATASET:
  SHUFFLE: True
  TRAIN: "/oscar/data/sreda/mabdelat/LLM4TB/output/data_merged_all/all_merged_deduplicated.jsonl"
  
tokenizer:
  padding_side: 'right'
  use_fast: False 

LLM:
  NAME: 'qwen4b-instruct'
  TEMP: 0.1

lora:
  lora_r: 256 
  lora_alpha: 256 
  lora_dropout: 0.1 
  use_dora: False 
  
bnb: 
  load_in_4bit: True 
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: True 
  
train:
  epochs: 4
  max_steps: -1               # make it -1 to use epochs
  max_seq_length: 5028
  batch_size: 8               
  gradient_accumulation_steps: 2  # your effective batch size is batch_size*gradient_accumulation_steps
  learning_rate: 2e-5
  report_to: "wandb"
  gradient_checkpointing: True   ## Leads to reduction in memory but slows down training by 20% 
  dataloader_num_workers: 0
  evaluation_strategy: 'steps'
  logging_strategy: 'steps'
  save_strategy: 'steps'
  logging_steps: 1
  eval_steps: 100
  save_steps: 100
  load_best_model_at_end: True
  lr_scheduler_type: 'cosine'
  run_name: qwen4b-instruct_r256_a256
  warmup_steps: 50

test:
  batch_size: 8
  num_samples: 10 # n for computing acc@k
  max_seq_length: 32000
  max_new_tokens: 10000